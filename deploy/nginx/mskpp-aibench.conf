# HTTP-only production site for the current internal ELB deployment.
# Install as /etc/nginx/sites-available/mskpp-aibench on Ubuntu, disable the
# distribution default site, enable this site, and run `sudo nginx -t`.
# Keep PLATFORM_SESSION_COOKIE_SECURE=false until HTTPS is configured.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name mskpp-aibench.hicomputing.huawei.com;

    root /var/www/mskpp-aibench;
    index index.html;
    client_max_body_size 2G;

    # ELB and platform.sh check the Nginx entry point without touching FastAPI.
    location = /elb-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # FastAPI routes already include /api, so proxy_pass has no trailing slash.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Vite build assets include content hashes and can be cached as immutable.
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # FastAPI Swagger and OpenAPI endpoints.
    location /docs {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.json {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /redoc {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router routes fall back to the SPA entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
