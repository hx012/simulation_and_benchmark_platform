name: ascend-platform

services:
  postgres:
    build:
      context: ./backend/docker/postgres
    image: ascend-platform-postgres
    container_name: ascend-platform-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-ascend_platform}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-CHANGE_ME}"
      POSTGRES_DB: "${POSTGRES_DB:-ascend_platform}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  postgres-data:
    name: ascend-platform-postgres-data
    external: true
